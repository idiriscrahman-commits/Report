<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Base background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />

  <!-- Shield / Document Frame -->
  <g filter="url(#shadow)" transform="translate(96, 80)">
    <!-- Document Card -->
    <rect x="0" y="0" width="320" height="360" rx="24" fill="#ffffff" fill-opacity="0.96" />
    
    <!-- Header stripe -->
    <path d="M 0 24 C 0 10.745 10.745 0 24 0 L 296 0 C 309.255 0 320 10.745 320 24 L 320 72 L 0 72 Z" fill="url(#accent)" />
    
    <!-- Mini emblem in header -->
    <circle cx="48" cy="36" r="14" fill="#ffffff" fill-opacity="0.25" />
    <circle cx="48" cy="36" r="8" fill="#ffffff" />
    <rect x="76" y="28" width="120" height="8" rx="4" fill="#ffffff" />
    <rect x="76" y="42" width="70" height="6" rx="3" fill="#ffffff" fill-opacity="0.75" />

    <!-- Content Lines / Analytics Graphic -->
    <!-- Bar chart illustration -->
    <rect x="40" y="104" width="32" height="90" rx="6" fill="#e2e8f0" />
    <rect x="40" y="144" width="32" height="50" rx="6" fill="#3b82f6" />

    <rect x="88" y="104" width="32" height="90" rx="6" fill="#e2e8f0" />
    <rect x="88" y="120" width="32" height="74" rx="6" fill="#1d4ed8" />

    <rect x="136" y="104" width="32" height="90" rx="6" fill="#e2e8f0" />
    <rect x="136" y="160" width="32" height="34" rx="6" fill="#60a5fa" />

    <rect x="184" y="104" width="32" height="90" rx="6" fill="#e2e8f0" />
    <rect x="184" y="110" width="32" height="84" rx="6" fill="#2563eb" />

    <!-- Checkmark Badge on right -->
    <circle cx="256" cy="148" r="30" fill="#10b981" />
    <path d="M 246 148 L 253 155 L 268 140" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Simulated report text lines -->
    <rect x="40" y="222" width="240" height="10" rx="5" fill="#334155" />
    <rect x="40" y="246" width="190" height="8" rx="4" fill="#64748b" />
    <rect x="40" y="266" width="220" height="8" rx="4" fill="#94a3b8" />
    <rect x="40" y="286" width="150" height="8" rx="4" fill="#cbd5e1" />

    <!-- Official Stamp / Seal -->
    <g transform="translate(220, 270)">
      <circle cx="36" cy="36" r="32" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-dasharray="4 2" />
      <text x="36" y="32" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="800" fill="#2563eb" letter-spacing="1">SRMS</text>
      <text x="36" y="44" text-anchor="middle" font-family="system-ui, sans-serif" font-size="7" font-weight="700" fill="#2563eb">VERIFIED</text>
    </g>
  </g>
</svg>
